name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install -e ".[config,gmail,evernote]" pytest numpy selenium soundfile markitdown
      - name: Test
        run: python -m pytest -q -rs --strict-markers
