name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PERSONAL_TERMS: ${{ secrets.PERSONAL_TERMS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install -e ".[config,gmail,evernote]" pytest numpy selenium soundfile
      - name: Test
        run: python -m pytest -q -rs --strict-markers -m "not macos and not private"
      - name: Personal terms
        if: ${{ env.PERSONAL_TERMS != '' }}
        run: python scripts/personal_terms_check.py --from-env PERSONAL_TERMS --tree .
