[project]
name = "agentkit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
llm = []
speech = ["mlx-audio>=0.3.0", "numpy", "sounddevice", "parakeet-mlx>=0.2.0", "soundfile"]
mlx_llm = ["mlx-lm>=0.20.0"]
audio = ["sounddevice", "numpy", "webrtcvad"]
gmail = ["google-api-python-client>=2.0", "google-auth>=2.0", "google-auth-oauthlib>=1.0"]
imap = []
notify = []
youtube = ["youtube-transcript-api", "requests"]
config = ["pyyaml>=6"]
evernote = ["evernote2", "thrift"]
all = ["agentkit[llm,speech,mlx_llm,audio,gmail,youtube,config,evernote]"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentkit*"]

[tool.setuptools.package-data]
agentkit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "local_port: the test opens a socket on 127.0.0.1; deselect it with -m 'not local_port' where a sandbox refuses the bind",
    "macos: the test needs Hanji.app, which exists only on a macOS host; the Linux CI deselects it with -m 'not macos'",
    "private: the test needs Chaehan's private socrates checkout, its ENML converter or its wording data; the CI deselects it with -m 'not private'",
]
